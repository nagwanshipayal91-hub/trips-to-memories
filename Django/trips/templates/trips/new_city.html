
    {% extends "trips/base.html" %}
    {% load bootstrap3 %}

    {% block header %}
    <h2> Add a new trip: </h2>
    {% endblock header %}

    {% block content %}
    
    <form action="{% url 'trips:new_trip' %}" method='post' class="form">
        {% csrf_token %}
        {% bootstrap_form form %}

        {% buttons %}
            <button name="submit" class="btn btn-primary"> add new trip</button>
        {% endbuttons %}
    </form>

    {% endblock content %}
